name: Release APK

# Produces a signed release APK. Signing inputs live in repository secrets, never in
# the repo: assembleRelease deliberately refuses to package without them.
#
# Required secrets:
#   JARVIS_KEYSTORE_BASE64     base64 of the release .jks  (base64 -w0 release.jks)
#   JARVIS_KEYSTORE_PASSWORD
#   JARVIS_KEY_ALIAS
#   JARVIS_KEY_PASSWORD
# Optional secrets (defaults keep the build working):
#   JARVIS_DEVELOPER_NAME, JARVIS_COPYRIGHT_OWNER
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets are present
        # Fail early with a clear message instead of letting Gradle's own check fire.
        env:
          KS: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.JARVIS_KEY_ALIAS }}
          KP: ${{ secrets.JARVIS_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KS" ]  || missing="$missing JARVIS_KEYSTORE_BASE64"
          [ -n "$KSP" ] || missing="$missing JARVIS_KEYSTORE_PASSWORD"
          [ -n "$KA" ]  || missing="$missing JARVIS_KEY_ALIAS"
          [ -n "$KP" ]  || missing="$missing JARVIS_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing required signing secrets:$missing"
            exit 1
          fi

      - name: Provide local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Materialise the release keystore
        env:
          KEYSTORE_B64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks" || { echo "::error::Decoded keystore is empty"; exit 1; }

      - name: Derive the certificate pin from the keystore
        # The pin must come from the same key that signs the APK, so derive it rather
        # than asking for a fifth secret that can silently drift out of sync.
        env:
          KSP: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.JARVIS_KEY_ALIAS }}
        run: |
          SHA=$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" \
                  -alias "$KA" -storepass "$KSP" 2>/dev/null \
                | grep -i 'SHA256:' | head -1 \
                | sed 's/.*SHA256: *//' | tr -d ': ' | tr 'a-f' 'A-F')
          if ! printf '%s' "$SHA" | grep -Eq '^[A-F0-9]{64}$'; then
            echo "::error::Could not read a SHA-256 fingerprint from the keystore"
            exit 1
          fi
          echo "CERT_SHA256=$SHA" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          JARVIS_RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          JARVIS_RELEASE_STORE_PASSWORD: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
          JARVIS_RELEASE_KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
          JARVIS_RELEASE_KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
          JARVIS_DEVELOPER_NAME: ${{ secrets.JARVIS_DEVELOPER_NAME }}
          JARVIS_COPYRIGHT_OWNER: ${{ secrets.JARVIS_COPYRIGHT_OWNER }}
        run: |
          export JARVIS_RELEASE_CERT_SHA256="$CERT_SHA256"
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify the APK is signed
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          # Use whichever build-tools the runner image ships rather than pinning a version.
          APKSIGNER=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::No apksigner found under $ANDROID_SDK_ROOT/build-tools"
            exit 1
          fi
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
